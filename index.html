<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision 市場</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/shop.css" />
</head>
<body>
  <h1>ショップ</h1>

  <div class="layout">
    <section>
      <h2>商品一覧</h2>
      <div id="products"><p class="empty">読み込み中...</p></div>
    </section>

    <section>
      <h2>カート</h2>
      <div id="cart"><p class="empty">カートは空です。</p></div>
      <div class="total" id="cart-total"></div>

      <div class="card" id="checkout" style="display:none;">
        <label>
          クーポンコード（任意）<br />
          <input type="text" id="coupon" placeholder="例: WELCOME500 / SALE10" />
        </label>
        <p>
          <button class="primary" id="order-btn">この内容で注文する</button>
        </p>
      </div>
      <!-- 注文結果メッセージ。カートが空になっても消えないよう checkout の外に置く -->
      <div id="result"></div>
    </section>
  </div>

  <section id="coupons-section">
    <h2>使えるクーポン</h2>
    <div id="coupons"><p class="empty">読み込み中...</p></div>
  </section>

  <footer class="appfoot">接続先サーバー: <code id="api-base"></code></footer>

  <!-- 共通ヘッダーナビ（自分で <header> を差し込む） -->
  <script type="module" src="js/ui/components/topbar.js"></script>
  <!-- ES モジュール -->
  <script type="module" src="js/entries/shop.js"></script>
</body>
</html>
