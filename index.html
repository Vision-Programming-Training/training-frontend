<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision 市場</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🛒 Vision 市場</a>
    <nav class="nav">
      <a class="nav-link active" href="index.html" aria-current="page">店舗</a>
      <a class="nav-link" href="orders.html">注文履歴</a>
      <a class="nav-link" href="admin.html">管理</a>
    </nav>
  </header>

  <h1>ショップ</h1>

  <div class="layout">
    <section>
      <h2>商品一覧</h2>
      <div id="products"><p class="empty">読み込み中...</p></div>
    </section>

    <section>
      <h2>カート</h2>
      <div id="cart"><p class="empty">カートは空です。</p></div>
      <div class="total" id="cart-total"></div>

      <div class="card" id="checkout" style="display:none;">
        <label>
          クーポンコード（任意）<br />
          <input type="text" id="coupon" placeholder="例: WELCOME500 / SALE10" />
        </label>
        <p>
          <button class="primary" id="order-btn">この内容で注文する</button>
        </p>
      </div>
      <!-- 注文結果メッセージ。カートが空になっても消えないよう checkout の外に置く -->
      <div id="result"></div>
    </section>
  </div>

  <section id="coupons-section">
    <h2>使えるクーポン</h2>
    <div id="coupons"><p class="empty">読み込み中...</p></div>
  </section>

  <footer class="appfoot">接続先サーバー: <code id="api-base"></code></footer>

  <!-- ES モジュール（main.js が config / api / cart / ui を import するので、読み込むのは main.js だけ） -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
